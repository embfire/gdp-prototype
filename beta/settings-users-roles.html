<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users and roles — PAR Guest360 Beta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0..1,0">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../assets/bento.css">
  <link rel="stylesheet" href="beta.css">
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="header-brand-lockup">
          <a href="index.html" class="header-brand" aria-label="Guest360 Home">
            <img src="../assets/par-guest360.svg" alt="PAR Guest360 logo" width="124" height="40">
          </a>
          <span class="header-beta-tag">Beta</span>
        </div>
        <span class="header-brand-divider" aria-hidden="true"></span>
        <button class="header-brand-btn" aria-label="Select brand">
          Cravewave
          <i class="ph ph-caret-down"></i>
        </button>
      </div>
      <div class="header-right">
        <button class="header-btn">
          <span class="material-symbols-rounded">magic_button</span>
          Intelligence
        </button>
        <button class="header-btn">
          <span class="material-symbols-rounded">feedback</span>
          Share feedback
        </button>
        <button class="header-btn header-btn--icon" aria-label="Profile">
          <span class="material-symbols-rounded">person</span>
        </button>
      </div>
    </header>

    <div class="app-shell__body">

      <!-- Sidebar -->
      <aside class="sidebar">
        <nav class="sidebar-nav" aria-label="Main navigation">

          <div class="nav-group" data-nav-group-id="top">
            <a href="index.html" class="nav-item">
              <i class="ph-duotone ph-chart-bar" aria-hidden="true"></i>
              <span class="nav-item__label">Dashboard</span>
            </a>
          </div>

          <div class="nav-group" data-nav-group-id="guests">
            <div class="nav-group-title">Guests</div>
            <a href="guest-profiles.html" class="nav-item">
              <i class="ph-duotone ph-user-circle" aria-hidden="true"></i>
              <span class="nav-item__label">Guest profiles</span>
            </a>
            <a href="guest-segments.html" class="nav-item">
              <i class="ph-duotone ph-users-three" aria-hidden="true"></i>
              <span class="nav-item__label">Segments</span>
            </a>
          </div>

          <div class="nav-group" data-nav-group-id="platform">
            <div class="nav-group-title">Platform</div>
            <a href="profile-stitching.html" class="nav-item">
              <i class="ph-duotone ph-fingerprint-simple" aria-hidden="true"></i>
              <span class="nav-item__label">Profile stitching</span>
            </a>
          </div>

          <div class="nav-group" data-nav-group-id="bottom">
            <button type="button" class="nav-item nav-item-expandable open" onclick="toggleNavExpand(this)" aria-expanded="true">
              <i class="ph-duotone ph-gear" aria-hidden="true"></i>
              <span class="nav-item__label">Settings</span>
              <i class="ph-bold ph-caret-right nav-item__chevron" aria-hidden="true"></i>
            </button>
            <div class="nav-sub-group open">
              <a href="settings-business-profile.html" class="nav-sub-item">Business profile</a>
              <a href="settings-users-roles.html" class="nav-sub-item active">Users and roles</a>
              <a href="settings-definitions.html" class="nav-sub-item">Definitions</a>
              <a href="settings-stores.html" class="nav-sub-item">Stores and store groups</a>
            </div>
            <button type="button" class="nav-item nav-item-expandable" onclick="toggleNavExpand(this)" aria-expanded="false">
              <i class="ph-duotone ph-wrench" aria-hidden="true"></i>
              <span class="nav-item__label">Cockpit</span>
              <i class="ph-bold ph-caret-right nav-item__chevron" aria-hidden="true"></i>
            </button>
            <div class="nav-sub-group">
              <a href="cockpit-features.html" class="nav-sub-item">Features</a>
              <a href="cockpit-admins.html" class="nav-sub-item">Admins</a>
            </div>
          </div>

        </nav>
      </aside>

      <!-- Main content -->
      <main class="main-content">
        <div class="content-area">

          <!-- Title Bar -->
          <div class="title-bar">
            <div class="title-bar__page-title">
              <h1 class="heading1">Users and roles</h1>
            </div>
          </div>

        </div>
      </main>
    </div>

  </div><!-- /app-shell -->

  <script>
    function toggleNavExpand(btn) {
      var isOpen = btn.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen);
      var sub = btn.nextElementSibling;
      if (sub && sub.classList.contains('nav-sub-group')) sub.classList.toggle('open', isOpen);
    }
  </script>
</body>
</html>
